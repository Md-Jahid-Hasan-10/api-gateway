
server:
  port: 8080

app:
  jwt:
    # MUST be identical to user-service.
    # At least 32 characters.
    secret: ${JWT_SECRET:78f2b81005ac23edf307e4368594d68fb1038cc667bc12f5b99946b8ea9e5ccb}

rate-limit:
  rules:
    - path: /api/auth/register
      limit: 10
      window-seconds: 3600
    - path: /api/auth/login
      limit: 30
      window-seconds: 300
    - path: /api/auth/verify
      limit: 20
      window-seconds: 3600

spring:
  application:
    name: api-gateway

  config:
    import: optional:file:.env[.properties]

  reactor:
    context-propagation: auto

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 15s

          routes:
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**

            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**

            - id: fund-transfer-service
              uri: lb://fund-transfer-service
              predicates:
                - Path=/api/transfers/**

            # Internal routes are never forwarded.
            # JwtAuthenticationFilter answers 404.
            - id: blocked-internal
              uri: no://op
              predicates:
                - Path=/internal/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://127.0.0.1:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                exposedHeaders:
                  - X-Trace-Id
                  - Retry-After
                maxAge: 3600

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    # Fetch registry more frequently after startup.
    registry-fetch-interval-seconds: 5

  instance:
    prefer-ip-address: true

management:
  server:
    port: 18080

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        gateway.requests: true

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      file: logstash
    json:
      add:
        service: ${spring.application.name}

  file:
    name: ${BANKING_LOG_DIR:${user.home}/banking-logs}/${spring.application.name}.json

  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 200MB
